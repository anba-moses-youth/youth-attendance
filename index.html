<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2c230">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>اجتماع الأنبا موسى</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;touch-action:manipulation;overscroll-behavior:none}
body{font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;font-size:18px;background:#f6ecd6 url(parch.jpg);color:#14202e}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;background:#f6ecd6 url(parch.jpg)}
header{background:#f2c230;color:#111;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px;min-height:64px}
header .t{flex:1;text-align:center;font-family:"Amiri","Noto Naskh Arabic","Droid Arabic Naskh",serif;font-size:21px;font-weight:700;line-height:1.25}
header .ib{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;padding:0}
header svg{width:30px;height:30px;fill:#111}
.ban{display:block;width:100%;border-radius:16px;margin:0 0 6px;box-shadow:0 2px 8px rgba(0,0,0,.25);height:300px;object-fit:cover}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px 4px}
.tile{border:0;background:none;display:flex;flex-direction:column;align-items:center;padding:8px 2px 10px;font:inherit;color:#14202e}
.tile img{width:min(40vw,200px);height:min(40vw,200px);object-fit:contain}
.emo{width:min(40vw,200px);height:min(40vw,200px);display:flex;align-items:center;justify-content:center;font-size:90px;background:#f2c230;border-radius:50%;transform:scale(.8)}
.tile span{font-family:"Amiri","Noto Naskh Arabic","Droid Arabic Naskh",serif;font-size:26px;font-weight:700;margin-top:2px}
.tile b{font-size:15px;color:#6a7788;font-weight:400}
main{flex:1;overflow-y:auto;padding:12px 12px 24px}
nav{display:none}
nav button{flex:1;border:0;background:none;padding:10px 2px 8px;font:inherit;font-size:14px;color:#6a7788;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:26px;line-height:1}
nav button.on{color:#1f3a5f;font-weight:700}
.card{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.name{font-weight:700;font-size:19px}
.sub{font-size:15px;color:#6a7788}
input,select,textarea{font:inherit;font-size:18px;width:100%;padding:12px;border:1px solid #c5cdd9;border-radius:10px;background:#fff;color:inherit}
textarea{min-height:110px}
label{display:block;font-size:15px;color:#6a7788;margin:10px 0 4px}
.btn{border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:700;font-size:18px;background:#1c1c1c;color:#f2c230}
.btn.sec{background:#efe3b8;color:#1c1c1c}
.btn.red{background:#c0392b}
.btn.green{background:#1e8e4e}
.btn.block{display:block;width:100%;margin-top:10px;text-align:center;text-decoration:none}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{flex:1;border:2px solid #d5dbe5;background:#fff;border-radius:12px;padding:12px 0;font:inherit;font-size:17px;font-weight:700;color:#6a7788}
.seg button.p{background:#1e8e4e;border-color:#1e8e4e;color:#fff}
.seg button.a{background:#c0392b;border-color:#c0392b;color:#fff}
.seg button.e{background:#d99a1c;border-color:#d99a1c;color:#fff}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stats div{flex:1;background:#fff;border-radius:12px;padding:10px 4px;text-align:center;font-size:14px;color:#6a7788;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stats b{display:block;font-size:26px;color:#14202e}
.gbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;white-space:nowrap}.gchip{flex:0 0 auto;border:2px solid #d9c9a0;background:#fff;border-radius:20px;padding:6px 12px;font:600 14px inherit;color:#333}.gchip.on{background:#f4c430;border-color:#b8860b}.ghd{margin:12px 2px 6px;font-weight:800;color:#6b4e16}
.badge{display:inline-block;background:#fde8e5;color:#c0392b;border-radius:20px;padding:2px 10px;font-size:14px;font-weight:700}
.badge.g{background:#e0f3e8;color:#1e8e4e}
.circ{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;text-decoration:none;border:0;background:#e3e9f2}
.circ.wa{background:#d9f5e3}
.fab{color:#f2c230;position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:16px;width:62px;height:62px;border-radius:50%;border:0;background:#1c1c1c;font-size:34px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet>div{background:#f3f5f9;width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px}
h3{margin:4px 0 10px;font-size:21px}
.empty{text-align:center;color:#6a7788;padding:40px 16px}
#splash{position:fixed;inset:0;background:#e8ec78;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;transition:opacity .5s}#splash img{width:min(80vw,420px);border-radius:50%}#splash div{font-family:"Amiri","Noto Naskh Arabic",serif;font-size:24px;font-weight:700;margin-top:14px;text-align:center;padding:0 16px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#14202e;color:#fff;padding:10px 18px;border-radius:20px;font-size:16px;z-index:9}
</style>
</head>
<body>
<div id="splash"><img src="splash.jpg" alt=""><div>اجتماع الأنبا موسى للشباب<br>كنيسة العذراء</div></div>
<div id="app">
<header id="hd"></header>
<main id="main"></main>
<nav id="nav"></nav>
</div>
<script src="hymns.js"></script>
<script src="hymns2.js"></script>
<script src="pp1.js"></script>
<script src="pp2.js"></script><script src="ppfix.js"></script><script src="audio.js"></script>
<script>
const KEY='youth-att.v1';
let S;
try{const bk=KEY+'.bak-pre-groups';if(!localStorage.getItem(bk)&&localStorage.getItem(KEY))localStorage.setItem(bk,localStorage.getItem(KEY))}catch(e){}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.members)S={members:[],sessions:{},follow:{},title:'اجتماع الأنبا موسى للشباب - كنيسة العذراء'};
if(S.title==='اجتماع الشباب')S.title='اجتماع الأنبا موسى للشباب - كنيسة العذراء';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('تعذر الحفظ')}}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AR='٠١٢٣٤٥٦٧٨٩';
const num=n=>String(n).replace(/\d/g,d=>AR[d]);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function ymd(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
const today=ymd(new Date());
let tab='home',date=today,q='';
const days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function fmt(s){const d=new Date(s+'T12:00:00');return days[d.getDay()]+' '+num(d.getDate())+' '+months[d.getMonth()]+' '+num(d.getFullYear())}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function intl(p){p=String(p||'').replace(/[^\d+]/g,'');if(!p)return'';if(p.startsWith('+'))return p.slice(1);if(p.startsWith('00'))return p.slice(2);if(p.startsWith('0'))return'2'+p;return p}
function best(m){return m.phone||m.parent||''}
function contactBtns(m){const p=best(m);if(!p)return'<span class="sub">لا يوجد رقم</span>';return `<a class="circ" href="tel:${esc(p)}">📞</a><a class="circ wa" href="https://wa.me/${intl(p)}" target="_blank" rel="noopener">💬</a>`}

const GROUPS=[['s1','ثانوي عام 1'],['s2','ثانوي عام 2'],['s3','ثانوي عام 3'],['t1','ثانوي فني 1'],['t2','ثانوي فني 2'],['t3','ثانوي فني 3'],['c1','كليات 1'],['c2','كليات 2'],['c3','كليات 3'],['c4','كليات 4'],['gc','خريجين كليات'],['gt','خريجين فني']];
const GN={};GROUPS.forEach(g=>GN[g[0]]=g[1]);const GL={};GROUPS.forEach(g=>GL[g[1]]=g[0]);
let GF='';
function gOf(m){return GN[m.g]?m.g:''}
function inG(m){return GF===''||(GF==='none'?gOf(m)==='':gOf(m)===GF)}
function msorted(){return sorted().filter(inG)}
function gCount(id){return S.members.filter(m=>id===''?true:id==='none'?gOf(m)==='':gOf(m)===id).length}
function anyG(){return S.members.some(m=>gOf(m))}
function gBar(fn){const c=(id,l)=>`<button class="gchip${GF===id?' on':''}" onclick="GF='${id}';${fn}">${l} (${num(gCount(id))})</button>`;
  return '<div class="gbar">'+c('','الكل')+GROUPS.map(g=>c(g[0],g[1])).join('')+(gCount('none')?c('none','بدون مجموعة'):'')+'</div>'}
function gGroup(list,row){if(GF!==''||!anyG())return list.map(row);const out=[];GROUPS.map(g=>g[0]).concat(['']).forEach(id=>{const l=list.filter(m=>gOf(m)===id);if(!l.length)return;out.push(`<div class="ghd">${id?GN[id]:'بدون مجموعة'} · ${num(l.length)}</div>`);l.forEach(m=>out.push(row(m)))});return out}
function gSummary(){if(GF!==''||!anyG())return'';const ds=sessionDates();let h='<div class="card"><div class="name" style="margin-bottom:6px">ملخص المجموعات</div>';
  GROUPS.map(g=>g[0]).concat(['']).forEach(id=>{const ms=S.members.filter(m=>gOf(m)===id);if(!ms.length)return;let p=0,t=0;ms.forEach(m=>ds.forEach(d=>{const v=S.sessions[d][m.id];if(v){t++;if(v==='p')p++}}));h+=`<div class="row" style="padding:4px 0"><div class="grow">${id?GN[id]:'بدون مجموعة'}</div><span class="sub">${num(ms.length)} مخدوم</span><b style="margin-inline-start:10px">${t?num(Math.round(p*100/t))+'٪':'-'}</b></div>`});return h+'</div>'}
function gBreak(){if(GF!==''||!anyG())return'';const ss=S.sessions[date]||{};let o='';GROUPS.map(g=>g[0]).concat(['']).forEach(id=>{const ms=S.members.filter(m=>gOf(m)===id);if(!ms.length)return;const p=ms.filter(m=>ss[m.id]==='p').length;o+=`\n${id?GN[id]:'بدون مجموعة'}: حاضر ${num(p)} من ${num(ms.length)}`});return '\n\nحسب المجموعة:'+o}
function gSel(id,v){return `<select id="${id}"><option value="">بدون مجموعة</option>${GROUPS.map(g=>`<option value="${g[0]}"${g[0]===v?' selected':''}>${g[1]}</option>`).join('')}</select>`}
function setG(id,v){const m=S.members.find(x=>x.id===id);if(m){if(v)m.g=v;else delete m.g;save()}}
function vAsg(){const list=msorted().filter(m=>m.name.includes(q));
  $('#main').innerHTML=gBar('vAsg()')+`<div class="sub" style="margin-bottom:8px">اختار مجموعة كل مخدوم. بيتحفظ فورًا ومفيش أي بيانات تانية بتتغير.</div><input placeholder="🔍 بحث بالاسم" value="${esc(q)}" oninput="q=this.value;vAsgList()" style="margin-bottom:10px"><div id="asl"></div>`;vAsgList()}
function vAsgList(){const list=msorted().filter(m=>m.name.includes(q));$('#asl').innerHTML=list.map(m=>`<div class="card"><div class="name">${esc(m.name)}</div><select onchange="setG('${m.id}',this.value)"><option value="">بدون مجموعة</option>${GROUPS.map(g=>`<option value="${g[0]}"${g[0]===gOf(m)?' selected':''}>${g[1]}</option>`).join('')}</select></div>`).join('')||'<div class="empty">لا نتائج</div>'}
function restoreBak(){const b=localStorage.getItem(KEY+'.bak-pre-groups');if(!b){toast('مفيش نسخة');return}sheet(`<h3>الرجوع لنسخة ما قبل المجموعات؟</h3><div class="sub">هترجع البيانات زي ما كانت قبل إضافة المجموعات، وهتتمسح أي توزيعات عملتها.</div><button class="btn red block" onclick="localStorage.setItem(KEY,localStorage.getItem(KEY+'.bak-pre-groups'));location.reload()">أيوه ارجع</button><button class="btn sec block" onclick="closeSheet()">لا</button>`)}
function sorted(){return S.members.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar'))}
function sessionDates(){return Object.keys(S.sessions).filter(d=>Object.keys(S.sessions[d]).length).sort()}
function missStreak(id){const ds=sessionDates().reverse();let n=0;for(const d of ds){const v=S.sessions[d][id];if(v==='a')n++;else if(v==='p')break;else if(v==='e')continue;else break}return n}
function lastSeen(id){const ds=sessionDates().reverse();for(const d of ds)if(S.sessions[d][id]==='p')return d;return null}

const HOME='<svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg>';
const BACK='<svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8-2-2 6-6-6-6z"/></svg>';
const TITLES={hy:'ترانيم وتماجيد',mb:'للمخدومين',att:'الحضور',mem:'القائمة',fu:'الافتقاد',bd:'أعياد الميلاد',st:'الإحصائيات',adm:'النسخ الاحتياطي والإدارة',asg:'توزيع المجموعات'};
function render(){
  const hd=$('#hd');
  if(tab==='home'){hd.innerHTML='<span class="ib"></span><div class="t">'+esc(S.title)+'</div><button class="ib" onclick="go(\'home\')">'+HOME+'</button>';}
  else{hd.innerHTML='<span class="ib"></span><div class="t">'+TITLES[tab]+'</div><button class="ib" onclick="go(\'home\')">'+HOME+'</button>';}
  $('#nav').innerHTML='';
  ({home:vHome,hy:vHy,mb:vMb,att:vAtt,mem:vMem,fu:vFu,bd:vBd,st:vSt,adm:vAdm,asg:vAsg,bib:function(){window.vBib()}})[tab]();
}
function go(t){tab=t;q='';render();$('#main').scrollTop=0}
let bi=0;
function photos(){let a=[];try{a=JSON.parse(localStorage.getItem('youth-att.photos')||'[]')}catch(e){}return ['banner.jpg','group.jpg','church.jpg'].concat(a)}
function newM(){go('mem');editM()}
function vHome(){
  const T=[['att','الحضور',1],['mem','القائمة',2],['new','مخدوم جديد',3],['fu','الافتقاد',4],['bd','أعياد الميلاد',5],['st','الإحصائيات',6],['hy','ترانيم وتماجيد',0],['mb','للمخدومين',0],['bib','الكتاب المقدس',0],['adm','نسخة احتياطية',7]];
  let ph=photos();bi=bi%ph.length;
  $('#main').innerHTML='<img class="ban" id="ban" onclick="bi++;vHome()" src="'+ph[bi]+'" alt=""><div class="tiles">'+T.map(t=>`<button class="tile" onclick="${t[0]==='new'?'newM()':`go('${t[0]}')`}">${t[2]?`<img src="tile${t[2]}.webp" alt="">`:`<div class="emo">${t[0]==='hy'?'🎶':t[0]==='bib'?'📖':'📲'}</div>`}<span>${t[1]}</span></button>`).join('')+'</div>'+(S.members.length?'':'<div class="sub" style="text-align:center;padding:10px">ابدأ بإضافة الشباب من «مخدوم جديد»</div>');
}

function vAtt(){
  const ss=S.sessions[date]||{};
  const list=msorted().filter(m=>m.name.includes(q));
  let p=0,a=0,e=0;S.members.filter(inG).forEach(m=>{const v=ss[m.id];if(v==='p')p++;else if(v==='a')a++;else if(v==='e')e++});
  const un=S.members.filter(inG).length-p-a-e;
  let h=`<div class="card"><label style="margin-top:0">تاريخ الاجتماع</label><input type="date" value="${date}" onchange="date=this.value||today;render()"><div class="sub" style="margin-top:6px">${fmt(date)}</div></div>`;
  if(!S.members.length)return $('#main').innerHTML=h+`<div class="empty">لسه مفيش مخدومين.<br>روح تبويب «المخدومين» وضيف الأسماء.<br><button class="btn" style="margin-top:14px" onclick="newM()">إضافة مخدومين</button></div>`;
  h+=`<div class="stats"><div><b style="color:#1e8e4e">${num(p)}</b>حاضر</div><div><b style="color:#c0392b">${num(a)}</b>غائب</div><div><b style="color:#d99a1c">${num(e)}</b>معتذر</div><div><b>${num(un)}</b>لم يُسجل</div></div>`;
  h+=gBar('vAtt()');h+=`<input placeholder="🔍 بحث بالاسم" value="${esc(q)}" oninput="q=this.value;vAttList()" style="margin-bottom:10px">`;
  h+=`<div class="row" style="margin-bottom:10px"><button class="btn green grow" onclick="allP()">الكل حاضر</button><button class="btn sec grow" onclick="shareSum()">إرسال الملخص</button></div><div id="alist"></div>`;
  $('#main').innerHTML=h;vAttList();
}
function vAttList(){
  const ss=S.sessions[date]||{};
  const list=msorted().filter(m=>m.name.includes(q));
  $('#alist').innerHTML=gGroup(list,m=>{const v=ss[m.id];return `<div class="card"><div class="name">${esc(m.name)}</div><div class="seg"><button class="${v==='p'?'p':''}" onclick="mark('${m.id}','p')">حاضر</button><button class="${v==='a'?'a':''}" onclick="mark('${m.id}','a')">غائب</button><button class="${v==='e'?'e':''}" onclick="mark('${m.id}','e')">معتذر</button></div></div>`}).join('')||'<div class="empty">لا نتائج</div>';
}
function mark(id,v){const ss=S.sessions[date]=S.sessions[date]||{};if(ss[id]===v)delete ss[id];else ss[id]=v;save();
  const y=$('#main').scrollTop;vAtt();$('#main').scrollTop=y}
function allP(){const ss=S.sessions[date]=S.sessions[date]||{};S.members.filter(inG).forEach(m=>{if(!ss[m.id])ss[m.id]='p'});save();vAtt();toast('تم تسجيل الباقي حاضر')}
function sumText(){const ss=S.sessions[date]||{};const g=v=>msorted().filter(m=>ss[m.id]===v).map(m=>m.name);
  const P=g('p'),A=g('a'),E=g('e');
  return `${S.title}${GF&&GF!=='none'?' ('+GN[GF]+')':''} - ${fmt(date)}\nحاضر: ${num(P.length)}\nغائب: ${num(A.length)}\nمعتذر: ${num(E.length)}${gBreak()}\n\nالغائبين:\n${A.map(n=>'- '+n).join('\n')||'-'}\n\nالمعتذرين:\n${E.map(n=>'- '+n).join('\n')||'-'}`}
async function shareSum(){const t=sumText();if(navigator.share){try{await navigator.share({text:t});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(t);toast('تم النسخ')}catch(e){prompt('انسخ الملخص',t)}}

function vMem(){
  let h=gBar('vMem()')+`<input placeholder="🔍 بحث بالاسم" value="${esc(q)}" oninput="q=this.value;vMemList()" style="margin-bottom:10px"><button class="btn block" style="margin-bottom:10px" onclick="impX()">📥 استيراد من Excel</button><button class="btn sec block" style="margin-bottom:10px" onclick="go('asg')">🗂 توزيع المخدومين على المجموعات</button><div id="mlist"></div><button class="fab" onclick="editM()">+</button>`;
  $('#main').innerHTML=h;vMemList();
}
function vMemList(){
  const list=msorted().filter(m=>m.name.includes(q));
  $('#mlist').innerHTML=gGroup(list,m=>`<div class="card row" onclick="editM('${m.id}')"><div class="grow"><div class="name">${esc(m.name)}</div><div class="sub">${gOf(m)?'<b>'+GN[gOf(m)]+'</b> · ':''}${esc(best(m))||'بدون رقم'}${m.birthday?' · 🎂 '+num(m.birthday.split('-').reverse().join('/')):''}${m.points?' · ⭐ '+num(m.points):''}${m.father?' · '+esc(m.father):''}</div></div><span style="font-size:22px;color:#9aa6b5">‹</span></div>`).join('')||`<div class="empty">${S.members.length?'لا نتائج':'اضغط + لإضافة مخدوم<br>أو «إضافة بالجملة» من تبويب المزيد'}</div>`;
}

function bulk(){sheet(`<h3>إضافة بالجملة</h3><div class="sub">اكتب كل مخدوم في سطر. تقدر تكتب: الاسم، التليفون، تليفون ولي الأمر، تاريخ الميلاد (2008-05-17)، المجموعة (مثلا: ثانوي عام 2)</div><textarea id="f_b" style="min-height:200px" placeholder="مينا جرجس، 01012345678"></textarea><button class="btn block" onclick="bulk2()">إضافة</button><button class="btn sec block" onclick="closeSheet()">إلغاء</button>`)}
function bulk2(){let n=0;$('#f_b').value.split('\n').forEach(l=>{const p=l.split(/[,،\t]/).map(x=>x.trim());if(!p[0])return;
  const dig=s=>String(s||'').replace(/[٠-٩]/g,d=>AR.indexOf(d));
  const bd=(dig(p[3]).match(/^\d{4}-\d{1,2}-\d{1,2}$/)||[''])[0].replace(/-(\d)(?=-|$)/g,'-0$1');
  const gg=GL[(p[4]||'').trim()];S.members.push(Object.assign({id:uid(),name:p[0],phone:dig(p[1]),parent:dig(p[2]),birthday:bd,notes:''},gg?{g:gg}:{}));n++});
  save();closeSheet();toast('تمت إضافة '+num(n));render()}
function backupText(){return JSON.stringify(S)}
async function exportD(){const t=backupText();
  try{const f=new File([t],'youth-attendance-backup.json',{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download='youth-attendance-backup.json';document.body.appendChild(a);a.click();a.remove();toast('تم حفظ الملف')}catch(e){}}
function importD(){sheet(`<h3>استرجاع نسخة</h3><div class="sub">اختار ملف النسخة الاحتياطية. هيحل محل البيانات الحالية.</div><input id="f_file" type="file" accept=".json,application/json" style="margin-top:10px"><button class="btn block" onclick="importGo()">استرجاع</button><button class="btn sec block" onclick="closeSheet()">إلغاء</button>`)}
function importGo(){const f=$('#f_file').files[0];if(!f){toast('اختار الملف');return}const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.members)throw 0;S=d;save();closeSheet();render();toast('تم الاسترجاع')}catch(e){toast('الملف غير صالح')}};r.readAsText(f)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
setTimeout(()=>{const p=$('#splash');p.style.opacity=0;setTimeout(()=>p.remove(),500)},1600);
</script>
