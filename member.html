<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2c230">
<link rel="manifest" href="member.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>شباب الأنبا موسى</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;font-size:19px;background:#f6ecd6 url(parch.jpg);color:#14202e}
.w{max-width:640px;margin:0 auto;padding-bottom:30px}
header{background:#f2c230;padding:12px;padding-top:calc(12px + env(safe-area-inset-top));text-align:center;font-family:"Amiri","Noto Naskh Arabic",serif;font-size:22px;font-weight:700;line-height:1.3}
header img{width:84px;height:84px;border-radius:50%;display:block;margin:0 auto 6px}
.tabs{display:flex;gap:6px;padding:10px 10px 0}
.tabs button{flex:1;border:0;border-radius:12px;padding:12px 2px;font:inherit;font-weight:700;background:#efe3b8;color:#1c1c1c}
.tabs button.on{background:#1c1c1c;color:#f2c230}
.c{padding:10px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card h3{margin:0;font-family:"Amiri","Noto Naskh Arabic",serif;font-size:22px}
.card .tx{white-space:pre-line;line-height:1.9;margin-top:10px;font-size:20px}
.sub{font-size:15px;color:#6a7788}
a{color:#1f3a5f}
.big{font-size:44px;font-weight:700}
.g{display:flex;gap:8px}.g>div{flex:1;background:#fff;border-radius:12px;padding:12px 4px;text-align:center;font-size:15px;color:#6a7788;box-shadow:0 1px 3px rgba(0,0,0,.1)}.g b{display:block;font-size:30px;color:#14202e}
</style>
</head>
<body>
<div class="w">
<header><img src="icon-192.png" alt="">اجتماع الأنبا موسى للشباب<br>كنيسة العذراء</header>
<div class="tabs"><button id="t_h" onclick="show('h')">ترانيم</button><button id="t_p" onclick="show('p')">تماجيد</button><button id="t_c" onclick="show('c')">كارتي</button></div>
<div class="c" id="c"></div>
</div>
<script src="hymns.js"></script><script src="hymns2.js"></script><script src="pp1.js"></script><script src="pp2.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const CK='youth-mem.card';
let card=null;
try{card=JSON.parse(localStorage.getItem(CK))}catch(e){}
if(location.hash.startsWith('#c=')){
  try{const j=decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(3)))));const d=JSON.parse(j);
  card={n:String(d.n||'').slice(0,80),p:+d.p||0,a:+d.a||0,t:+d.t||0,ab:+d.ab||0,pts:+d.pts||0,ls:String(d.ls||'').slice(0,10),d:String(d.d||'').slice(0,10)};
  localStorage.setItem(CK,JSON.stringify(card));history.replaceState(null,'',location.pathname)}catch(e){}
}
let T=card?'c':'h';
function items(k){let a=window.HYMNS.filter(x=>k==='hymn'?(x.cat==='hymn'||x.cat==='pp'):x.cat===k);return a}
function list(k){const a=items(k);return a.length?a.map(x=>`<div class="card"><h3>${esc(x.title)}</h3><div class="tx" style="white-space:pre-wrap">${esc(x.text)}</div>${x.url?`<div class="sub" style="margin-top:8px">المصدر: <a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.src)}</a></div>`:''}</div>`).join(''):'<div class="card sub" style="text-align:center">هتتضاف ترانيم قريب</div>'}
function show(t){T=t;['h','p','c'].forEach(k=>$('#t_'+k).className=k===t?'on':'');
  if(t==='h')$('#c').innerHTML=list('hymn');
  else if(t==='p')$('#c').innerHTML=list('praise');
  else $('#c').innerHTML=card?`<div class="card" style="text-align:center"><div class="sub">كارت</div><h3>${esc(card.n)}</h3></div>
  <div class="card" style="text-align:center"><div class="sub">نسبة حضورك</div><div class="big">${num(card.p)}٪</div><div class="sub">حضرت ${num(card.a)} من ${num(card.t)} اجتماع</div></div>
  <div class="g"><div><b>${num(card.ab)}</b>غياب</div><div><b>⭐ ${num(card.pts)}</b>نقاطك</div></div>
  <div class="sub" style="text-align:center;margin-top:12px">آخر تحديث: ${esc(card.d)}${card.ls?' · آخر حضور: '+esc(card.ls):''}<br>الكارت ده بتاعك أنت بس. لو عايز تحدثه اطلب لينك جديد من خادمك.</div>`
  :'<div class="card" style="text-align:center">الكارت بتاعك بيظهر هنا بعد ما خادمك يبعتلك لينكك الخاص (فيه حضورك ونقطك).</div>'}
show(T);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
